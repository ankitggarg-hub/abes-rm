<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Academic & Training Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f4f5f3;--surface:#ffffff;--ink:#161c17;--mut:#5c6b60;--line:#dde3dc;
 --pri:#2f5d4f;--pri-ink:#1e4237;--pri-tint:#e6efe9;
 --ok:#1f7a4d;--warn:#9a6a10;--bad:#b3392f;--wbg:#fbf1de;--bbg:#fbe9e6;--gbg:#e6f3ea;
 --font-ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--font-display:'Newsreader',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10140f;--surface:#171d17;--ink:#e8ece7;--mut:#93a294;--line:#2a332a;
 --pri:#3f8f76;--pri-ink:#2c6b55;--pri-tint:#1c2d25;--ok:#4bbd85;--warn:#dda23a;--bad:#e2685c;--wbg:#2d2717;--bbg:#331f1c;--gbg:#17301f}}
:root[data-theme="dark"]{--bg:#10140f;--surface:#171d17;--ink:#e8ece7;--mut:#93a294;--line:#2a332a;
 --pri:#3f8f76;--pri-ink:#2c6b55;--pri-tint:#1c2d25;--ok:#4bbd85;--warn:#dda23a;--bad:#e2685c;--wbg:#2d2717;--bbg:#331f1c;--gbg:#17301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui)}
h1{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.1px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;font-family:var(--font-display);font-weight:600;font-size:16px;flex:none}
.hdr-right{display:flex;align-items:center;gap:14px}.who{font-weight:500}
main{max-width:1120px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{max-width:360px;width:100%;box-shadow:0 8px 28px -14px rgba(20,30,20,.28)}
.login .brand{margin-bottom:4px}.login .mark{width:36px;height:36px;font-size:18px}
.login p.mut{margin:2px 0 18px}
.fl{display:block;font-size:12px;color:var(--mut);margin-bottom:12px}
.fl input{display:block;width:100%;margin-top:5px}
.hint{margin-top:14px !important;font-size:12px}.hint code{background:var(--pri-tint);color:var(--pri);padding:1px 5px;border-radius:4px;font-size:11px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;transition:border-color .12s,background .12s}
input[type=number]{width:52px;padding:7px 4px}textarea{width:100%;min-width:170px;height:46px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px;border-color:var(--pri)}
button{cursor:pointer;background:var(--pri);color:#fff;border-color:var(--pri);padding:7px 14px;font-weight:500}
button:hover{background:var(--pri-ink);border-color:var(--pri-ink)}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--line)}button.sec:hover{background:var(--pri-tint);border-color:var(--pri)}
button.dng{background:transparent;color:var(--bad);border:1px solid var(--line)}button.dng:hover{background:var(--bbg);border-color:var(--bad)}
input:disabled,textarea:disabled,select:disabled{opacity:.5;cursor:not-allowed;background:var(--bg)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs button{background:none;color:var(--mut);border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 4px;margin-right:18px;font-weight:500}
.tabs button:hover{color:var(--ink);background:none}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--mut);font-weight:500;border-bottom:1.5px solid var(--ink)}
.tw tbody tr:hover td{background:var(--pri-tint)}
.al{padding:10px 14px;border-radius:6px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);color:var(--ink)}
.al.w{border-left-color:var(--warn)}.al.g{border-left-color:var(--ok)}
.al.b{border-left-color:var(--bad);background:var(--bbg);color:var(--bad);font-weight:500}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--bg);border:1px solid var(--line)}
.tag.ok{background:var(--gbg);color:var(--ok);border-color:transparent}.tag.w{background:var(--wbg);color:var(--warn);border-color:transparent}.tag.b{background:var(--bbg);color:var(--bad);border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.mut{color:var(--mut);font-size:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}.calhd{font-size:11px;color:var(--mut);text-align:center;padding:2px}
.calday{min-height:56px;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;font-size:12px;position:relative}.calday:hover{border-color:var(--pri);background:var(--pri-tint)}.calday.blank{border-color:transparent;cursor:default}.calday.blank:hover{background:none}
.calday .dn{font-weight:600}
.calday.wo{background:var(--bg);border-style:dashed}.calday .wolbl{position:absolute;top:4px;right:5px;font-size:9px;color:var(--mut)}
.calday.off-g{background:var(--bbg);border-color:transparent}.calday.off-g:hover{background:var(--bbg)}
.calday.off-s{background:var(--pri-tint);border-color:transparent}.calday.off-s:hover{background:var(--pri-tint)}
.calday .reason{margin-top:3px;font-size:9.5px;line-height:1.2;color:var(--ink);opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}.swatch.g{background:var(--bbg);border:1px solid var(--bad)}.swatch.s{background:var(--pri-tint);border:1px solid var(--pri)}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9;font-size:13px}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const mon=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addW=(k,n)=>{const x=new Date(k+'T12:00:00');x.setDate(x.getDate()+7*n);return iso(x)};
const CUR=iso(mon(new Date())),LAST=addW(CUR,-1);
const fmt=k=>{const a=new Date(k+'T12:00:00'),b=new Date(k+'T12:00:00');b.setDate(b.getDate()+5);const o={day:'numeric',month:'short'};return a.toLocaleDateString('en-GB',o)+' – '+b.toLocaleDateString('en-GB',o)};
const MAXH=80;
let mh='',lbp='last',rsec='',rhd='',rFrom='',rTo='',calMonth=CUR.slice(0,8)+'01',impFile=null,impName='',impResults=null,impSummary=null,impPreview=null,ovYear='',ovCourse='',ovHead='',ovStatus='',ovSearch='',secSearch='',usrSearch='',hSec='',edRec='',edHol='',lastChartRows=null,lastChartLabel='',chartInstance=null,S=null,me=null,tab='home',wk=LAST,ow=LAST,dbDoc=null,mode='local';
const seed=()=>({users:[{id:'u0',name:'Administrator',username:'admin',password:'admin123',role:'admin',active:true}],years:[{id:'y1',name:'Year 1'},{id:'y2',name:'Year 2'}],courses:[],categories:[],sections:[],plans:{},actuals:{},unlocks:{},holidays:[],weeklyOff:0,termStart:'2026-07-01'});
window.addEventListener('unhandledrejection',e=>toast('Error: '+((e.reason&&e.reason.message)||e.reason),1));window.addEventListener('error',e=>toast('Error: '+e.message,1));
const norm=()=>{['users','years','courses','categories','sections','holidays'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});['plans','actuals','unlocks'].forEach(k=>{if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={}});if(S.weeklyOff==null||isNaN(S.weeklyOff))S.weeklyOff=0;if(!S.termStart)S.termStart='2026-07-01'};
let lastSave=0,sync='';
function setSync(m,bad){sync=m;const e=$('#sync');if(e){e.textContent=m;e.style.color=bad?'var(--bad)':''}}
async function save(){lastSave=Date.now();setSync('Saving…');
 try{const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
  if(!r.ok)throw new Error('Server returned '+r.status);
  setSync('✓ Saved')
 }catch(e){setSync('✗ Not saved',1);toast('Save failed: '+(e.message||e)+' — check your connection and try again',1)}}
async function pollState(){try{const r=await fetch('/api/state');if(!r.ok)return;const data=await r.json();
 if(!data){if(!S){S=seed();norm();await save()}return}
 if(Date.now()-lastSave<3000)return; // avoid clobbering an in-flight save with a stale poll
 S=data;norm();if(me)me=S.users.find(u=>u.id===me.id&&u.active)||null;
 if(!document.activeElement||!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))render()}catch(e){}}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--bad)':'';t.style.color=bad?'#fff':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const K=(s,w)=>s+'|'+w,unl=(s,w)=>!!S.unlocks[K(s,w)];
const planEd=(s,w)=>w>=CUR||unl(s,w),actEd=(s,w)=>w<CUR&&(w===LAST||unl(s,w));
const nm=(list,id)=>(S[list].find(x=>x.id===id)||{}).name||'—';
const secLabel=s=>`${nm('years',s.yearId)} · ${nm('courses',s.courseId)} · ${esc(s.name)}`;
const catSum=h=>h?Object.values(h).reduce((s,v)=>s+(typeof v==='number'?v:0),0):0;
const hasAny=h=>h&&Object.values(h).some(v=>typeof v==='number');
function status(s,w){const p=S.plans[K(s,w)],a=S.actuals[K(s,w)];
 if(!p)return w<CUR?['Not planned','b']:['Not planned','w'];
 if(a)return(catSum(a.hours)<catSum(p.hours))?['Shortfall','w']:['Completed','ok'];
 return w<CUR?['Actual pending','b']:['Planned','']}
async function boot(){
 setSync('Loading…');
 try{const r=await fetch('/api/state');const data=r.ok?await r.json():null;
  if(data){S=data}else{S=seed();await save()}
  setSync('✓ Saved')
 }catch(e){setSync('✗ Offline',1);toast('Could not reach the server — check your connection',1);S=seed()}
 norm();
 try{const id=sessionStorage.getItem('me');if(id)me=S.users.find(u=>u.id===id&&u.active)||null}catch(e){}
 render();
 setInterval(pollState,8000)}
function login(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
 const x=S.users.find(a=>a.username.toLowerCase()===u&&a.password===p);
 if(!u||!p)return toast('Enter username and password',1);
 if(!x)return toast('Invalid username or password',1);
 if(!x.active)return toast('Account is disabled. Contact admin.',1);
 me=x;tab='home';try{sessionStorage.setItem('me',x.id)}catch(e){}render()}
function logout(){me=null;try{sessionStorage.removeItem('me')}catch(e){}render()}
function render(){const A=$('#app');
 if(!me){A.innerHTML=`<div class="login-wrap"><div class="card login">
 <div class="brand"><span class="mark">W</span><div><h1>Weekly Tracker</h1><p class="mut">Academic &amp; training load, by week</p></div></div>
 <label class="fl">Username<input id="lu" placeholder="e.g. admin" autocomplete="username"></label>
 <label class="fl">Password<input id="lp" type="password" placeholder="••••••••" autocomplete="current-password"></label>
 <button onclick="login()" style="width:100%">Sign in</button>
 </div></div>`;
 $('#lp').onkeydown=e=>{if(e.key==='Enter')login()};return}
 const adm=me.role==='admin',tabs=adm?[['home','Overview & Unlock'],['import','Import Backlog'],['calendar','Calendar / Off Days'],['report','Progress Report'],['lb','Leaderboard'],['map','Head Mapping'],['users','Users'],['sections','Sections'],['years','Years'],['courses','Courses'],['categories','Load Categories']]:[['home','Weekly Load'],['calendar','Calendar / Off Days'],['report','My Progress'],['lb','Leaderboard']];
 A.innerHTML=`<header><div class="brand"><span class="mark">W</span><h1>Weekly Tracker</h1><span class="tag">${adm?'Admin':'Dept. Head'}</span></div>
 <div class="hdr-right"><span id="sync" class="mut">${esc(sync)}</span><span class="who">${esc(me.name)}</span><button class="sec" onclick="logout()">Logout</button></div></header><main>
 <div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 ${adm?({home:adminHome,import:importV,calendar:calendarV,report:reportV,lb:lbV,map:mapV,users:usersV,sections:secV,years:()=>master('years','Year'),courses:()=>master('courses','Course'),categories:()=>master('categories','Load Category')})[tab]():(tab==='lb'?lbV():tab==='report'?reportV():tab==='calendar'?calendarV():headV())}</main>`;
 if(tab==='report')setTimeout(drawProgressChart,0);else if(chartInstance){chartInstance.destroy();chartInstance=null}}
function drawProgressChart(){const el=document.getElementById('progChart');
 if(!el||!window.Chart||!lastChartRows||!lastChartRows.length){if(chartInstance){chartInstance.destroy();chartInstance=null}return}
 if(chartInstance){chartInstance.destroy();chartInstance=null}
 try{
  const labels=lastChartRows.map(r=>fmt(r.w)),planned=lastChartRows.map(r=>r.ptot),actual=lastChartRows.map(r=>r.due&&r.hasA?r.atot:null);
  chartInstance=new Chart(el,{type:'bar',data:{labels,datasets:[
   {label:'Planned',data:planned,backgroundColor:'rgba(47,93,79,0.35)'},
   {label:'Actual',data:actual,backgroundColor:'rgba(31,122,77,0.8)'}]},
   options:{responsive:true,plugins:{legend:{position:'bottom'},title:{display:true,text:`Planned vs Actual hours — ${lastChartLabel}`}},scales:{y:{beginAtZero:true,title:{display:true,text:'Hours'}}}}})
 }catch(e){chartInstance=null}}
/* ---------- HEAD ---------- */
function headV(){const mine=S.sections.filter(s=>s.headId===me.id);
 if(!mine.length)return`<div class="al w">No sections are mapped to you yet. Please contact the admin.</div>`;
 if(!S.categories.length)return`<div class="al w">The admin hasn't set up any Load Categories yet (e.g. Academic, CCPD Training, SEEP, Domain). Please contact the admin before you can plan weekly load.</div>`;
 if(!mine.find(s=>s.id===hSec))hSec='';
 const shown=hSec?mine.filter(s=>s.id===hSec):mine;
 const pend=mine.filter(s=>!S.actuals[K(s.id,LAST)]&&(S.plans[K(s.id,LAST)]||actEd(s.id,LAST)));
 const noPlan=mine.filter(s=>!S.plans[K(s.id,CUR)]);
 const weeks=[];for(let w=iso(mon(S.termStart));w<=addW(CUR,4);w=addW(w,1))weeks.push(w);
 const cats=S.categories;
 const rows=shown.map(s=>{const p=S.plans[K(s.id,wk)]||{},a=S.actuals[K(s.id,wk)]||{},pe=planEd(s.id,wk),ae=actEd(s.id,wk)&&!!S.plans[K(s.id,wk)],st=status(s.id,wk),id=s.id;
  const ph=p.hours||{},ah=a.hours||{};
  const short=hasAny(ah)&&(catSum(ah)<catSum(ph));
  const cells=cats.map(c=>`<td><input type="number" min="0" max="${MAXH}" step="0.5" id="p_${id}_${c.id}" value="${ph[c.id]??''}" ${pe?'':'disabled'}></td><td><input type="number" min="0" max="${MAXH}" step="0.5" id="a_${id}_${c.id}" value="${ah[c.id]??''}" ${ae?'':'disabled'} oninput="chk('${id}')"></td>`).join('');
  return`<tr><td><b>${secLabel(s)}</b><br><span class="tag ${st[1]}">${st[0]}</span>${unl(id,wk)?' <span class="tag ok">Unlocked</span>':''}<br><span class="mut">${workingDaysInWeek(wk,id)} working day(s) this week</span></td>
  ${cells}
  <td><textarea id="rm_${id}" placeholder="Reason if load not covered…" ${ae?'':'disabled'}>${esc(a.remark||'')}</textarea><div class="mut" id="vr_${id}">${short?'Shortfall (compensation allowed across categories): '+(catSum(ah)-catSum(ph)).toFixed(1)+' h':''}</div></td>
  <td>${pe||ae?`<button onclick="saveRow('${id}')">Save</button>`:''} ${(pe&&hasAny(ph))||(ae&&hasAny(ah))?`<button class="dng" onclick="deleteMyRecord('${id}')">Delete</button>`:''} ${!pe&&!ae?'<span class="mut">🔒 Locked</span>':''}</td></tr>`}).join('');
 const headCells=cats.map(c=>`<th>Plan ${esc(c.name)} (h)</th><th>Actual ${esc(c.name)} (h)</th>`).join('');
 return`${pend.length?`<div class="al b">⚠ Actual load for last week (${fmt(LAST)}) is pending for ${pend.length} section(s): ${pend.map(s=>esc(s.name)).join(', ')}. Submit before it locks after this week.</div>`:''}
 ${noPlan.length?`<div class="al w">Planned load for the current week (${fmt(CUR)}) is not defined for ${noPlan.length} section(s).</div>`:''}
 <div class="card"><b>Bulk-plan upcoming weeks</b><p class="mut">Set the same planned load across several upcoming weeks in one go, for one section or a whole year at once — you can still edit or delete any individual week afterward.</p>
 <div class="row">${(()=>{const yrIds=[...new Set(mine.map(s=>s.yearId))],opts=[];
  yrIds.forEach(yid=>{const n=mine.filter(s=>s.yearId===yid).length;if(n>1)opts.push(`<option value="year:${yid}">All my sections in ${esc(nm('years',yid))} (${n} sections)</option>`)});
  mine.forEach(s=>opts.push(`<option value="sec:${s.id}">${secLabel(s)}</option>`));
  return`<select id="bp_sec"><option value="">Apply to…</option>${opts.join('')}</select>`})()}
 ${cats.map(c=>`<label class="mut" style="display:flex;flex-direction:column;gap:3px">${esc(c.name)}<input type="number" min="0" max="${MAXH}" step="0.5" id="bp_${c.id}" style="width:70px"></label>`).join('')}
 <label class="mut" style="display:flex;flex-direction:column;gap:3px">Weeks<input type="number" min="1" max="52" value="4" id="bp_weeks" style="width:60px"></label>
 <button onclick="bulkPlan()" style="align-self:flex-end">Apply</button></div></div>
 <div class="card"><div class="row"><b>Week:</b><select onchange="wk=this.value;render()">${weeks.map(w=>`<option value="${w}" ${w===wk?'selected':''}>${fmt(w)}${w===CUR?' (This week)':w===LAST?' (Last week)':w>CUR?' (Upcoming)':''}</option>`).join('')}</select>
 ${mine.length>1?`<b>Section:</b><select onchange="hSec=this.value;render()"><option value="">All my sections</option>${mine.map(s=>`<option value="${s.id}" ${s.id===hSec?'selected':''}>${secLabel(s)}</option>`).join('')}</select>`:''}
 <span class="mut">Hours per week, by category. Plan: this & upcoming weeks. Actual: last week only; older weeks are locked until admin unlocks.</span></div>
 <div class="tw"><table><tr><th>Section</th>${headCells}<th>Remark</th><th></th></tr>${rows||`<tr><td colspan=${2+cats.length*2} class="mut">No section matches this filter.</td></tr>`}</table></div></div>`}
async function bulkPlan(){const sel=$('#bp_sec').value;if(!sel)return toast('Choose a section or a year to apply to',1);
 const mine=S.sections.filter(s=>s.headId===me.id);
 let targetIds;
 if(sel.startsWith('year:')){const yid=sel.slice(5);targetIds=mine.filter(s=>s.yearId===yid).map(s=>s.id)}
 else{targetIds=[sel.slice(4)]}
 if(!targetIds.length)return toast('No matching sections found',1);
 const n=parseInt($('#bp_weeks').value,10);if(!n||n<1||n>52)return toast('Enter a number of weeks between 1 and 52',1);
 const ph={};let has=false,bad=false;
 S.categories.forEach(c=>{const el=$('#bp_'+c.id);if(el&&el.value!==''){const v=parseFloat(el.value);if(isNaN(v)||v<0||v>MAXH)bad=true;else{ph[c.id]=v;has=true}}});
 if(bad)return toast(`Hours must be between 0 and ${MAXH}`,1);
 if(!has)return toast('Enter at least one category\'s hours',1);
 const scopeMsg=targetIds.length>1?`${targetIds.length} sections`:'this section';
 if(!confirm(`This will set the planned load for the next ${n} week(s) for ${scopeMsg}, starting this week, overwriting any existing plan for those weeks. Continue?`))return;
 targetIds.forEach(sid=>{let w=CUR;for(let i=0;i<n;i++){S.plans[K(sid,w)]={hours:{...ph},by:me.id,ts:Date.now()};w=addW(w,1)}});

 <div class="card"><div class="row"><b>Week:</b><select onchange="ow=this.value;render()">${weeks.map(w=>`<option value="${w}" ${w===ow?'selected':''}>${fmt(w)}${w===CUR?' (This week)':w===LAST?' (Last week)':''}</option>`).join('')}</select><span class="mut">Unlock lets the head edit plan and actual for that section-week. Lock it again when done.</span></div>
 <div class="row"><input id="ovq" placeholder="Search section or head…" value="${esc(ovSearch)}" oninput="ovSearch=this.value;render()" style="min-width:200px">
 <select onchange="ovYear=this.value;render()"><option value="">All years</option>${S.years.map(y=>`<option value="${y.id}" ${y.id===ovYear?'selected':''}>${esc(y.name)}</option>`).join('')}</select>
 <select onchange="ovCourse=this.value;render()"><option value="">All courses</option>${S.courses.map(c=>`<option value="${c.id}" ${c.id===ovCourse?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <select onchange="ovHead=this.value;render()"><option value="">All heads</option>${heads.map(u=>`<option value="${u.id}" ${u.id===ovHead?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
 <select onchange="ovStatus=this.value;render()"><option value="">All statuses</option>${statuses.map(x=>`<option value="${x}" ${x===ovStatus?'selected':''}>${x}</option>`).join('')}</select>
 ${(ovYear||ovCourse||ovHead||ovStatus||ovSearch)?`<button class="sec" onclick="ovYear='';ovCourse='';ovHead='';ovStatus='';ovSearch='';render()">Clear filters</button>`:''}</div>
 <div class="tw"><table><tr><th>Section</th><th>Head</th>${catHeadCells}<th>Status</th><th>Remark</th><th>Access</th></tr>${rows||`<tr><td colspan=${5+cats.length*2} class="mut">${S.sections.length?'No section matches this filter.':'No sections yet. Add them in Section Mapping.'}</td></tr>`}</table></div></div>`}
async function toggleUnlock(id){const k=K(id,ow);if(S.unlocks[k])delete S.unlocks[k];else S.unlocks[k]=true;await save();render()}
async function saveRecord(id){const ph={},ah={};let phHas=false,ahHas=false,badRange=false;
 S.categories.forEach(c=>{
  const pv=$('#er_p_'+c.id).value,av=$('#er_a_'+c.id).value;
  if(pv!==''){const v=parseFloat(pv);if(isNaN(v)||v<0||v>MAXH)badRange=true;else{ph[c.id]=v;phHas=true}}
  if(av!==''){const v=parseFloat(av);if(isNaN(v)||v<0||v>MAXH)badRange=true;else{ah[c.id]=v;ahHas=true}}
 });
 if(badRange)return toast(`Hours must be between 0 and ${MAXH}`,1);
 const rm=$('#er_rm').value.trim();
 if(phHas&&ahHas&&(catSum(ah)<catSum(ph))&&rm.length<5)return toast('Combined Actual hours are below combined Planned — a remark (5+ characters) is required',1);
 const k=K(id,ow);
 if(phHas)S.plans[k]={hours:ph,by:me.id,ts:Date.now()};else delete S.plans[k];
 if(ahHas)S.actuals[k]={hours:ah,remark:rm,by:me.id,ts:Date.now()};else delete S.actuals[k];
 edRec='';await save();toast('Record updated');render()}
async function deleteRecord(id){if(!confirm('Delete the planned and actual load for this section and week? This cannot be undone.'))return;
 const k=K(id,ow);delete S.plans[k];delete S.actuals[k];await save();toast('Record deleted');render()}
let edIt='',edSec='',edUsr='';
function master(kind,label){const inUse=id=>S.sections.some(s=>(kind==='years'?s.yearId:s.courseId)===id);
 return`<div class="card"><div class="row"><input id="mn" placeholder="New ${label} name"><button onclick="addM('${kind}')">Add</button></div><table>${S[kind].map(x=>edIt===kind+':'+x.id?
  `<tr><td><input id="ed_${x.id}" value="${esc(x.name)}" style="width:100%"></td><td style="width:150px"><button onclick="saveEditMaster('${kind}','${x.id}')">Save</button> <button class="sec" onclick="edIt='';render()">Cancel</button></td></tr>`
  :`<tr><td>${esc(x.name)}</td><td style="width:150px"><button class="sec" onclick="edIt='${kind}:${x.id}';render()">Edit</button> <button class="dng" onclick="delM('${kind}','${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td class="mut">None yet</td></tr>'}</table></div>`}
async function addM(kind){const n=$('#mn').value.trim();if(!n)return toast('Name is required',1);if(S[kind].some(x=>x.name.toLowerCase()===n.toLowerCase()))return toast('Already exists',1);S[kind].push({id:uid(),name:n});await save();render()}
async function saveEditMaster(kind,id){const v=$('#ed_'+id).value.trim();if(!v)return toast('Name is required',1);
 if(S[kind].some(x=>x.id!==id&&x.name.toLowerCase()===v.toLowerCase()))return toast('Already exists',1);
 S[kind].find(x=>x.id===id).name=v;edIt='';await save();toast('Updated');render()}
function kindInUse(kind,id){if(kind==='years')return S.sections.some(s=>s.yearId===id);
 if(kind==='courses')return S.sections.some(s=>s.courseId===id)||S.users.some(u=>u.courseId===id);
 if(kind==='categories')return[...Object.values(S.plans),...Object.values(S.actuals)].some(r=>r.hours&&Object.prototype.hasOwnProperty.call(r.hours,id));
 return false}
async function delM(kind,id){if(kindInUse(kind,id))return toast('In use — cannot delete',1);S[kind]=S[kind].filter(x=>x.id!==id);await save();render()}
function usersV(){const cOpt=(sel)=>`<option value="">Select course…</option>${S.courses.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}`;
 const addRole=$('#ur')?.value||'head';
 const q=usrSearch.toLowerCase();
 const list=S.users.filter(u=>u.id===edUsr||!q||u.name.toLowerCase().includes(q)||u.username.toLowerCase().includes(q)||(u.courseId&&nm('courses',u.courseId).toLowerCase().includes(q)));
 return`<div class="card"><div class="row"><input id="un" placeholder="Full name"><input id="uu" placeholder="Username"><input id="up" type="password" placeholder="Password (min 6)"><select id="ur" onchange="render()"><option value="head" ${addRole==='head'?'selected':''}>Dept. Head</option><option value="admin" ${addRole==='admin'?'selected':''}>Admin</option></select>${addRole==='head'?`<select id="urc">${cOpt('')}</select>`:''}<button onclick="addU()">Add user</button></div>
 <div class="mut">A Department Head must be mapped to a course when created. You can change this later using Edit.</div>
 <div class="row"><input placeholder="Search name, username or course…" value="${esc(usrSearch)}" oninput="usrSearch=this.value;render()" style="min-width:220px">${usrSearch?`<button class="sec" onclick="usrSearch='';render()">Clear</button>`:''}</div>
 <div class="tw"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Course</th><th>Status</th><th>New password</th><th></th></tr>${list.map(u=>edUsr===u.id?
  `<tr><td><input id="eu_n_${u.id}" value="${esc(u.name)}"></td><td><input id="eu_u_${u.id}" value="${esc(u.username)}"></td>
   <td><select id="eu_r_${u.id}" onchange="render()">${['head','admin'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r==='head'?'Dept. Head':'Admin'}</option>`).join('')}</select></td>
   <td>${($('#eu_r_'+u.id)?.value||u.role)==='head'?`<select id="eu_c_${u.id}">${cOpt(u.courseId)}</select>`:'<span class="mut">—</span>'}</td>
   <td colspan="2"><button onclick="saveEditUser('${u.id}')">Save</button> <button class="sec" onclick="edUsr='';render()">Cancel</button></td><td></td></tr>`
  :`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role==='head'?'Dept. Head':'Admin'}</td>
   <td>${u.role==='head'?(u.courseId?esc(nm('courses',u.courseId)):'<span class="tag b">Not mapped</span>'):'<span class="mut">—</span>'}</td>
   <td><span class="tag ${u.active?'ok':'b'}">${u.active?'Active':'Disabled'}</span></td>
   <td><input type="password" id="pw_${u.id}" placeholder="••••••"> <button class="sec" onclick="setPw('${u.id}')">Set</button></td>
   <td><button class="sec" onclick="edUsr='${u.id}';render()">Edit</button> <button class="sec" onclick="togU('${u.id}')">${u.active?'Disable':'Enable'}</button></td></tr>`).join('')||`<tr><td colspan=7 class="mut">No user matches this search.</td></tr>`}</table></div></div>`}
async function addU(){const n=$('#un').value.trim(),u=$('#uu').value.trim(),p=$('#up').value,r=$('#ur').value,c=$('#urc')?.value||'';
 if(!n||!u||p.length<6)return toast('Name, username and a password of 6+ characters are required',1);
 if(S.users.some(x=>x.username.toLowerCase()===u.toLowerCase()))return toast('Username already taken',1);
 if(r==='head'&&!c)return toast('Select a course to map this Department Head to',1);
 S.users.push({id:uid(),name:n,username:u,password:p,role:r,courseId:r==='head'?c:null,active:true});await save();render()}
async function saveEditUser(id){const n=$('#eu_n_'+id).value.trim(),u=$('#eu_u_'+id).value.trim(),r=$('#eu_r_'+id).value,c=$('#eu_c_'+id)?.value||'';
 if(!n||!u)return toast('Name and username are required',1);
 if(S.users.some(x=>x.id!==id&&x.username.toLowerCase()===u.toLowerCase()))return toast('Username already taken',1);
 if(r==='head'&&!c)return toast('Select a course to map this Department Head to',1);
 const usr=S.users.find(x=>x.id===id);usr.name=n;usr.username=u;usr.role=r;usr.courseId=r==='head'?c:null;
 edUsr='';await save();toast('User updated');render()}
async function setPw(id){const p=$('#pw_'+id).value;if(p.length<6)return toast('Password must be 6+ characters',1);S.users.find(u=>u.id===id).password=p;await save();toast('Password updated');render()}
async function togU(id){const u=S.users.find(x=>x.id===id);if(u.id===me.id)return toast('You cannot disable your own account',1);u.active=!u.active;await save();render()}
function secV(){const heads=S.users.filter(u=>u.role==='head'&&u.active),opt=(l,sel)=>l.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
 const q=secSearch.toLowerCase();
 const list=S.sections.filter(s=>{if(s.id===edSec)return true;if(!q)return true;const hd=S.users.find(u=>u.id===s.headId);
  return nm('years',s.yearId).toLowerCase().includes(q)||nm('courses',s.courseId).toLowerCase().includes(q)||s.name.toLowerCase().includes(q)||(hd&&hd.name.toLowerCase().includes(q))});
 return`<div class="card"><div class="row"><select id="sy"><option value="">Year…</option>${opt(S.years)}</select><select id="sc"><option value="">Course…</option>${opt(S.courses)}</select><input id="sn" placeholder="Section (e.g. A)" style="width:130px"><select id="sh"><option value="">Head…</option>${opt(heads)}</select><button onclick="addS()">Add mapping</button></div>
 <div class="row"><input placeholder="Search year, course, section or head…" value="${esc(secSearch)}" oninput="secSearch=this.value;render()" style="min-width:220px">${secSearch?`<button class="sec" onclick="secSearch='';render()">Clear</button>`:''}</div>
 <div class="tw"><table><tr><th>Year</th><th>Course</th><th>Section</th><th>Department Head</th><th></th></tr>${list.map(s=>edSec===s.id?
  `<tr><td><select id="es_y_${s.id}">${opt(S.years,s.yearId)}</select></td><td><select id="es_c_${s.id}">${opt(S.courses,s.courseId)}</select></td><td><input id="es_n_${s.id}" value="${esc(s.name)}"></td>
   <td><select id="es_h_${s.id}"><option value="">Unmapped</option>${opt(heads,s.headId)}</select></td>
   <td><button onclick="saveEditSection('${s.id}')">Save</button> <button class="sec" onclick="edSec='';render()">Cancel</button></td></tr>`
  :`<tr><td>${nm('years',s.yearId)}</td><td>${nm('courses',s.courseId)}</td><td>${esc(s.name)}</td><td><select onchange="remap('${s.id}',this.value)"><option value="">Unmapped</option>${opt(heads,s.headId)}</select></td>
   <td><button class="sec" onclick="edSec='${s.id}';render()">Edit</button> <button class="dng" onclick="delS('${s.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan=5 class="mut">${S.sections.length?'No section matches this search.':'No sections yet'}</td></tr>`}</table></div></div>`}
async function addS(){const y=$('#sy').value,c=$('#sc').value,n=$('#sn').value.trim(),h=$('#sh').value;
 if(!y||!c||!n||!h)return toast('Select year, course, head and enter a section name',1);
 if(S.sections.some(s=>s.yearId===y&&s.courseId===c&&s.name.toLowerCase()===n.toLowerCase()))return toast('This section already exists',1);
 S.sections.push({id:uid(),name:n,yearId:y,courseId:c,headId:h});await save();render()}
async function saveEditSection(id){const y=$('#es_y_'+id).value,c=$('#es_c_'+id).value,n=$('#es_n_'+id).value.trim(),h=$('#es_h_'+id).value;
 if(!y||!c||!n)return toast('Select year, course and enter a section name',1);
 if(S.sections.some(s=>s.id!==id&&s.yearId===y&&s.courseId===c&&s.name.toLowerCase()===n.toLowerCase()))return toast('This section already exists',1);
 const s=S.sections.find(x=>x.id===id);s.yearId=y;s.courseId=c;s.name=n;s.headId=h;edSec='';await save();toast('Section updated');render()}
async function remap(id,h){S.sections.find(s=>s.id===id).headId=h;await save();toast('Head updated')}
async function delS(id){if(Object.keys(S.plans).some(k=>k.startsWith(id+'|')))return toast('Section has recorded data — reassign the head instead of deleting',1);S.sections=S.sections.filter(s=>s.id!==id);await save();render()}
/* ---------- HEAD MAPPING ---------- */
function mapV(){const heads=S.users.filter(u=>u.role==='head'&&u.active);
 if(!heads.find(x=>x.id===mh))mh=heads[0]?.id||'';
 if(!heads.length)return`<div class="al w">Create Dept. Head users first (Users tab).</div>`;
 if(!S.sections.length)return`<div class="al w">Add sections first (Sections tab).</div>`;
 const sum=heads.map(u=>{const ss=S.sections.filter(s=>s.headId===u.id),ys=[...new Set(ss.map(s=>nm('years',s.yearId)))];
  return`<tr><td>${esc(u.name)}</td><td>${ys.join(', ')||'—'}</td><td>${ss.length}</td></tr>`}).join('');
 const grp=S.years.map(y=>{const ss=S.sections.filter(s=>s.yearId===y.id);if(!ss.length)return'';
  return`<div style="margin-bottom:10px"><div class="row"><b>${esc(y.name)}</b><button class="sec" onclick="assignYear('${y.id}')">Assign whole year</button></div>${ss.map(s=>{const o=S.users.find(u=>u.id===s.headId);
  return`<label style="display:block;padding:3px 0"><input type="checkbox" ${s.headId===mh?'checked':''} onchange="assignS('${s.id}',this.checked)"> ${nm('courses',s.courseId)} · ${esc(s.name)} ${o&&o.id!==mh?`<span class="mut">(currently ${esc(o.name)})</span>`:''}</label>`}).join('')}</div>`}).join('');
 return`<div class="al g">Each head sees and edits only the sections mapped to them. Others' entries stay hidden; only ranks and percentages appear on the leaderboard.</div>
 <div class="card"><div class="row"><b>Department Head:</b><select onchange="mh=this.value;render()">${heads.map(u=>`<option value="${u.id}" ${u.id===mh?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>${grp}</div>
 <div class="card"><b>Mapping summary</b><div class="tw"><table><tr><th>Head</th><th>Years</th><th>Sections</th></tr>${sum}</table></div></div>`}
async function assignS(id,on){S.sections.find(s=>s.id===id).headId=on?mh:'';await save();toast(on?'Section assigned':'Section unassigned');render()}
async function assignYear(y){S.sections.filter(s=>s.yearId===y).forEach(s=>s.headId=mh);await save();toast('Year assigned');render()}
/* ---------- LEADERBOARD ---------- */
function lbV(){const ok=w=>isReasonableWeekKey(w)&&w<CUR&&(lbp==='all'||(lbp==='last'?w===LAST:w>=addW(CUR,-4))),sc={};
 Object.keys(S.plans).forEach(k=>{const[sid,w]=k.split('|');if(!ok(w))return;const p=S.plans[k],a=S.actuals[k],o=sc[sid]=sc[sid]||{p:0,c:0,n:0,s:0};const pt=catSum(p.hours);o.p+=pt;o.n++;if(a){o.s++;o.c+=Math.min(catSum(a.hours),pt)}});
 const fin=(name,o,mine)=>({name,mine,p:o.p,c:o.c,n:o.n,s:o.s,pct:o.p?o.c/o.p*100:0,sub:o.n?o.s/o.n*100:0});
 const heads=S.users.filter(u=>u.role==='head'&&u.active).map(u=>{const t={p:0,c:0,n:0,s:0};S.sections.filter(s=>s.headId===u.id).forEach(s=>{const o=sc[s.id];if(o){t.p+=o.p;t.c+=o.c;t.n+=o.n;t.s+=o.s}});return fin(u.name,t,u.id===me.id)});
 const secs=S.sections.filter(s=>sc[s.id]).map(s=>fin(secLabel(s),sc[s.id],s.headId===me.id));
 const srt=a=>a.filter(x=>x.n).sort((a,b)=>b.pct-a.pct||b.sub-a.sub);
 const med=['🥇','🥈','🥉'],bar=x=>`<div style="background:var(--bd);border-radius:99px;height:8px;min-width:90px"><div style="width:${Math.min(100,x)}%;height:8px;border-radius:99px;background:var(--pri)"></div></div>`;
 const tbl=(a,t,adm)=>`<div class="card"><b>${t}</b><div class="tw"><table><tr><th>#</th><th>Name</th><th>Load covered</th><th></th><th>Entries submitted</th>${adm?'<th>Planned h</th><th>Actual h</th>':''}</tr>${srt(a).map((x,i)=>`<tr ${x.mine?'style="background:var(--gbg)"':''}><td>${med[i]||i+1}</td><td>${x.name}${x.mine?' <span class="tag ok">You</span>':''}</td><td><b>${x.pct.toFixed(1)}%</b></td><td>${bar(x.pct)}</td><td>${x.s}/${x.n}</td>${adm?`<td>${x.p}</td><td>${x.c.toFixed(1)}</td>`:''}</tr>`).join('')||'<tr><td colspan=7 class="mut">No completed weeks in this period yet.</td></tr>'}</table></div></div>`;
 const adm=me.role==='admin';
 return`<div class="card"><div class="row"><b>Period:</b><select onchange="lbp=this.value;render()"><option value="last" ${lbp==='last'?'selected':''}>Last week</option><option value="4w" ${lbp==='4w'?'selected':''}>Last 4 weeks</option><option value="all" ${lbp==='all'?'selected':''}>All time</option></select>
 <span class="mut">Load covered = hours delivered (capped at plan) ÷ planned hours, Academic + Training. Missing entries count as 0. Ties are broken by submission rate.</span></div></div>
 ${tbl(heads,'Department Head ranking',adm)}${tbl(secs,'Section ranking',adm)}`}
boot();
</script></body></html>
